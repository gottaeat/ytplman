<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
  <title>ytplman</title>
</head>
<body>
<main>
  <form id="cookie-form" autocomplete="off">
    <label for="cookie">Cookie</label>
    <input id="cookie" type="password" spellcheck="false" maxlength="60000" required>
    <button>Set</button>
  </form>
  <form id="playlist-form" autocomplete="off">
    <label for="playlist">Playlist</label>
    <input id="playlist" type="text" spellcheck="false" maxlength="1000" required>
    <button id="load" disabled>Load</button>
  </form>
  <p id="status" role="status"></p>
  <fieldset id="editor" disabled>
    <h1 id="title"></h1>
    <nav aria-label="Playlist actions">
      <button id="sort">A–Z + dedupe</button>
      <label><input id="all" type="checkbox"> All</label>
      <button id="up" aria-label="Move selected up">↑</button>
      <button id="down" aria-label="Move selected down">↓</button>
      <button id="delete">Delete</button>
      <button id="reset">Reset</button>
      <button id="commit">Commit…</button>
    </nav>
    <progress id="progress" max="1" value="0" hidden aria-label="Commit progress"></progress>
    <div id="songs" tabindex="0" aria-label="Playlist songs"></div>
  </fieldset>
</main>
<dialog id="review" aria-label="Review changes">
  <p id="summary"></p>
  <pre id="changes"></pre>
  <button id="close-review">Cancel</button>
  <button id="confirm">Commit to YouTube</button>
</dialog>
</body>
</html>
